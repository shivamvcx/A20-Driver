name: "Build & Release CI"

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build x64 Executable
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile via build.bat
      run: |
        .\build.bat

    - name: Verify Artifact Existence
      run: |
        if (!(Test-Path "release\RedgearA20-win-x64.exe")) {
          throw "Build output release\RedgearA20-win-x64.exe was not created."
        }
        if (!(Test-Path "release\RedgearA20-win-x64.sha256")) {
          throw "Checksum file release\RedgearA20-win-x64.sha256 was not created."
        }
        Write-Host "Build verification passed!"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RedgearA20-win-x64
        path: release/

    - name: Publish GitHub Release Assets
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/RedgearA20-win-x64.exe
          release/RedgearA20-win-x64.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
